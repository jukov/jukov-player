"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = [
    "local.properties",
]

[scripts]
setup = "./scripts/check-env.sh"
run_mode = "concurrent"

[scripts.run.unit-check]
command = "./scripts/check-unit.sh"
default = true
icon = "zap"

[scripts.run.fast-check]
command = "./scripts/check-fast.sh"
icon = "test-tube"

[scripts.run.full-check]
command = "./scripts/check-full.sh"
icon = "shield-check"

[scripts.run.ios-check]
available_in = [ "local" ]
command = "./scripts/check-ios.sh"
icon = "smartphone"
