"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

spotlight_testing = true

file_include_globs = [
    "local.properties",
    "iosApp/Configuration/Local.xcconfig",
]

[scripts]
setup = "./scripts/check-env.sh"
run_mode = "nonconcurrent"

[scripts.run.unit-check]
command = "./scripts/check-unit.sh"
default = true
icon = "zap"

[scripts.run.fast-check]
command = "./scripts/check-fast.sh"
icon = "test-tube"

[scripts.run.full-check]
command = "./scripts/check-full.sh"
icon = "shield-check"

[scripts.run.ios-check]
available_in = [ "local" ]
command = "./scripts/check-ios.sh"
icon = "smartphone"

# Spotlight syncs the active workspace into the repository root watched by Xcode.
[scripts.run.open-spotlight-xcode]
available_in = [ "local" ]
command = "open \"$CONDUCTOR_ROOT_PATH/iosApp/iosApp.xcodeproj\""
icon = "app-window"

[scripts.run.android-device-check]
available_in = [ "local" ]
command = "./scripts/check-android-device.sh"
icon = "monitor-smartphone"
