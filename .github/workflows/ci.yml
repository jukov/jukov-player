name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Run iOS simulator checks"
        type: boolean
        default: true
      run_android_device:
        description: "Run Android device smoke checks"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-fast:
    name: Android and shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Android and shared checks
        run: ./scripts/check-fast.sh

      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Android host coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate coverage reports
        run: ./scripts/check-coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-coverage
          path: shared/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 7

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect iOS-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ios:
              - 'iosApp/**'
              - 'shared/src/commonMain/**'
              - 'shared/src/commonTest/**'
              - 'shared/src/ios*/**'
              - 'shared/src/apple*/**'
              - 'shared/src/native*/**'
              - 'shared/schemas/**'
              - 'shared/build.gradle.kts'
              - 'scripts/check-ios.sh'
              - 'scripts/check-full.sh'
              - '.github/workflows/ci.yml'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'buildSrc/**'

  macos-ios-simulator:
    name: iOS simulator checks
    runs-on: macos-latest
    timeout-minutes: 45
    needs: changes
    if: >
      always() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_ios) ||
        (
          github.event_name == 'pull_request' &&
          needs.changes.result == 'success' &&
          needs.changes.outputs.ios == 'true'
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Run shared iOS tests
        run: ./scripts/check-ios.sh --tests

      - name: Build iOS app for simulator
        run: ./scripts/check-ios.sh --debug-simulator

  macos-ios-release:
    name: Nightly iOS release device build
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build iOS app for release device
        run: ./scripts/check-ios.sh --release-device

  pr-gate:
    name: Required PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - linux-fast
      - changes
      - macos-ios-simulator
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Verify required checks
        env:
          LINUX_FAST_RESULT: ${{ needs.linux-fast.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_IOS_RESULT: ${{ needs.macos-ios-simulator.result }}
        run: |
          if [[ "$LINUX_FAST_RESULT" != "success" ]]; then
            echo "Android and shared checks did not pass: $LINUX_FAST_RESULT"
            exit 1
          fi

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not pass: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$MACOS_IOS_RESULT" != "success" && "$MACOS_IOS_RESULT" != "skipped" ]]; then
            echo "iOS checks did not pass: $MACOS_IOS_RESULT"
            exit 1
          fi

          echo "All checks required for this pull request passed."

  android-device-smoke:
    name: Android device smoke (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: linux-fast
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_android_device)
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device smoke tests
        run: ./scripts/check-android-device.sh --api-${{ matrix.api }}

      - name: Capture connected-device logcat
        if: failure()
        run: adb logcat -d > androidApp/build/device-logcat-api-${{ matrix.api }}.txt || true

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-api-${{ matrix.api }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            androidApp/build/outputs/managed_device_android_test_additional_output/
            androidApp/build/device-logcat-api-${{ matrix.api }}.txt
          if-no-files-found: ignore
          retention-days: 7
